<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/chimera-icon.png" />
    <link rel="apple-touch-icon" href="/chimera-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Frames only, and nothing else. A frame may load from this page's own origin, from about:
      (the srcdoc frames of the HTML preview and the design artboard), or from blob:/data: (built in
      the page). Every other frame source is refused, which is what stops a frame navigating itself
      to an outside host. The page policy the backend serves already says frame-src 'none'; the two
      intersect, so this line changes nothing where that header is present and covers a document
      that arrives without it. Scripts, styles, connections and images are deliberately not named.
      Checked by src/lib/framePolicy.test.ts.
    -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'self' about: blob: data:" />
    <title>Chimera</title>
    <!--
      Resolve theme, motion, text size and fonts BEFORE first paint. React sets these in an effect, which runs after the
      first frame — so without this the app painted dark, then flipped. Kept inline and dependency-
      free on purpose: an external file would be one more round-trip in front of the flash it exists
      to prevent. Storage keys are mirrored in src/lib/theme.ts and asserted equal by theme.test.ts.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        function pick(key, valid, fallback) {
          try {
            var v = localStorage.getItem(key);
            return valid.indexOf(v) >= 0 ? v : fallback;
          } catch (e) {
            return fallback; // private mode / storage disabled — never block the paint
          }
        }
        var t = pick("chimera.theme", ["light", "dark", "system"], "system");
        d.dataset.theme =
          t !== "system" ? t : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        var m = pick("chimera.motion", ["full", "reduced", "system"], "system");
        // Only stamp an explicit override; "system" leaves the CSS media query in charge.
        if (m !== "system") d.dataset.motion = m;
        // Text size and fonts, the same way: a default stamps nothing, so it is today's page.
        var s = pick("chimera.textSize", ["small", "medium", "large"], "medium");
        if (s !== "medium") d.dataset.textSize = s;
        var f = pick("chimera.font", ["system", "serif", "dyslexic"], "system");
        if (f !== "system") d.dataset.font = f;
        var c = pick("chimera.codeFont", ["default", "cascadia", "jetbrains"], "default");
        if (c !== "default") d.dataset.fontCode = c;
        // Interface zoom (src/lib/uiZoom.ts). Storage holds strings, so the list is strings too: a
        // numeric list here never matched and the zoom waited for React, scaling after first paint.
        var z = pick("chimera.uiZoom", ["80", "90", "100", "110", "120"], "100");
        if (z !== "100") d.style.zoom = z + "%";
        // Your own theme: accent, surface tint, contrast. Defaults stamp nothing, as above.
        var a = pick("chimera.accent", ["blue", "cyan", "green", "amber", "rose", "graphite"], "blue");
        if (a !== "blue") d.dataset.accent = a;
        var n = pick("chimera.tint", ["navy", "neutral", "warm"], "navy");
        if (n !== "navy") d.dataset.tint = n;
        var k = pick("chimera.contrast", ["standard", "high"], "standard");
        if (k !== "standard") d.dataset.contrast = k;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
