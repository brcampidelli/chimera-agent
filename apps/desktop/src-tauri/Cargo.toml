[package]
name = "chimera-desktop"
version = "0.64.2"
description = "Chimera Agent — native desktop shell"
authors = ["Bruno Campidelli"]
edition = "2021"
rust-version = "1.77"

# The shell is a thin native window + tray around the SAME server the pip path runs — it launches a
# PyInstaller-frozen `chimera-backend` sidecar (bundled as a resource), waits for the free-port URL it
# writes, then points the webview at that localhost origin. No divergent server code lives here.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# In-place auto-updater: checks GitHub's latest.json, verifies the Minisign signature against the
# embedded pubkey, then downloads + installs + relaunches — only after the user confirms. The dialog
# plugin provides the native confirm prompt; relaunch uses the core `AppHandle::restart()` (no process
# plugin needed). See tauri.conf.json `plugins.updater` for the pubkey/endpoint.
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# The OS language, for the update dialog. It is the only place this process needs a locale: the
# window loads the sidecar's http origin with no IPC granted (see capabilities/default.json), so
# the language the user picked INSIDE the app is not readable from here. See `idioma_do_dialogo`.
sys-locale = "0.3"
# Opens an external link in the system browser. The window grants no IPC, so a link the page asks to
# open in a new window reaches `on_new_window` in main.rs, and only an http(s) address off this app's
# origin is handed to the OS from there. `open` is what tauri-plugin-opener itself uses underneath;
# the plugin would add webview commands this app does not grant.
open = "5.4.4"
# One app per machine account. A second copy started a second backend on the same data folder, which
# that backend now refuses (exit 3, `chimera/core/instance.py`), leaving the second click with an
# error dialog. With the plugin the second launch never gets that far: it hands over to the running
# app, which brings its window forward.
tauri-plugin-single-instance = "2"
