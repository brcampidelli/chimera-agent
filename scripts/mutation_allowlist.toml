# --- runs: 2026-10-05 — survivors the new duck-typing tests left standing ----------------------
#     build_receipt reads a duck-typed attempt with `getattr(a, F, default) or fallback`. When the
#     fallback is "" (or "none"), mutating the DEFAULT to None is provably equivalent: the `or`
#     already normalises falsy to the fallback, so `getattr(a, F, None) or ""` == `getattr(a, F,
#     "") or ""` for every input. Same class as the `bool(None)` entry in confirm.py. The two
#     token-count mutants are the same shape with `or 0`.
