# --- version_api: 2026-10-05 — survivors the new candidate-track tests left standing ------------
#     The four header-case mutants are the same class the file already allowlists for _fetch_latest
#     (RFC 7230 3.2: header names are case-insensitive; urllib normalises on the way in, so the
#     outgoing request is byte-identical). The codec alias is the same class as the runs entries.
#     The two short-circuit mutants were PROVEN equivalent: `bool(latest)` is False exactly when
#     `latest or ""` is "", and _is_newer returns False on an unparseable input — so the fallback
#     string is never read; and `tag or ""` feeds _parse_version, which returns None for "" and
#     for "XXXX" alike, so the `tag is None` guard makes the fallback unreachable.
"chimera.api.version_api.x__get_json__mutmut_7"   = "HTTP header name case: 'User-Agent' -> 'user-agent'. Case-insensitive per RFC 7230 3.2; urllib normalises, the outgoing request is identical."
"chimera.api.version_api.x__get_json__mutmut_8"   = "HTTP header name case: 'User-Agent' -> 'USER-AGENT'. Same class."
"chimera.api.version_api.x__get_json__mutmut_10"  = "HTTP header name case: 'Accept' -> 'accept'. Same class."
"chimera.api.version_api.x__get_json__mutmut_11"  = "HTTP header name case: 'Accept' -> 'ACCEPT'. Same class."
"chimera.api.version_api.x__get_json__mutmut_21"  = "Codec alias: decode('utf-8') -> decode('UTF-8'). Case-insensitive codec name; identical bytes."
"chimera.api.version_api.x_check_version__mutmut_13" = "Fallback 'latest or \"\"' -> 'latest or \"XXXX\"'. Proven equivalent: the guard is `bool(latest) and _is_newer(...)`, and _is_newer returns False for an unparseable input — the fallback string is never read."
"chimera.api.version_api.x__fetch_latest__mutmut_19" = "Fallback 'tag or \"\"' -> 'tag or \"XXXX\"'. Proven equivalent: _parse_version returns None for both, and the `tag is None` guard skips the entry before the fallback can matter."

# --- core.verify: 2026-10-05 — survivors the new contract tests left standing -----------------
#     The two shlex defaults were PROVEN equivalent empirically: shlex.split(cmd) and
#     shlex.split(cmd, posix=None) are byte-identical (None means False, the documented default),
#     and the strip-None mutant is unreachable because `if not tokens` returns first. The prose
#     mutants follow the same policy as _prompt's: wording, never behaviour — the raise, the
#     abstention and the flag they decorate are all asserted.
"chimera.core.verify.x_program_missing__mutmut_3"  = "shlex.split(command, posix=None). Proven equivalent: None is the documented default (False); the probe shows byte-identical token lists on every input the tests drive."
"chimera.core.verify.x_program_missing__mutmut_12" = "strip(None) as the SECOND strip (after strip of quotes). The only characters a leading/trailing-quote-stripped token can still have at its edges that `strip(None)` would remove are whitespace — and a workspace file whose name begins or ends with whitespace is unreachable through `which` (it strips names the same way) and pointless through the explicit-path arm, where the token already carries the separator. Equivalent for every input the predicate can answer about."
"chimera.core.verify.x_module_missing__mutmut_3"   = "shlex.split(command, posix=None). Proven equivalent (see program_missing _3)."
"chimera.core.verify.xǁCommandVerifierǁ__init____mutmut_5" = "ValueError prose 'to know who authored the command' -> XX..XX. The raise and the match='not one of' are asserted; wording is not behaviour."
"chimera.core.verify.xǁCommandVerifierǁ__init____mutmut_6" = "ValueError prose upper-cased. Same: the raise is asserted, the wording is not."
