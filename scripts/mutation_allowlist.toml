# A guard whose boundary value raises ValueError downstream anyway.
"chimera.eval.proportions.x_z_two_sided__mutmut_3" = "0 < alpha -> 0 <= alpha. At alpha = 0, NormalDist.inv_cdf(1.0) raises StatisticsError, a ValueError subclass: same exception type."
"chimera.eval.proportions.x_t_quantile__mutmut_3" = "0 < p -> 0 <= p. At p = 0 the p < 0.5 branch calls t_quantile(1.0), which raises ValueError: same exception."
"chimera.eval.proportions.x__check_margin__mutmut_7" = "0 < alpha -> 0 <= alpha. At alpha = 0, z_two_sided(0) raises ValueError: same exception."
"chimera.eval.proportions.x__check_margin__mutmut_8" = "alpha < 0.5 -> alpha <= 0.5. At alpha = 0.5, z_two_sided(1.0) raises ValueError: same exception."
"chimera.eval.proportions.x__check_margin__mutmut_9" = "alpha < 0.5 -> alpha < 1.5. Any alpha >= 0.5 makes z_two_sided(2 * alpha) raise ValueError: same exception."
# A guard whose boundary value computes the same result as the guard returns.
"chimera.eval.proportions.x_mcnemar_exact__mutmut_4" = "m == 0 -> m == 1. At m = 0 the sum is comb(0,0)/1 = 1, doubled and clamped to 1.0; at m = 1 it is 2 * 1/2 = 1.0. Both equal the guard's 1.0."
"chimera.eval.proportions.x_bonett_price_paired__mutmut_1" = "n <= 0 -> n < 0. At n = 0 the formula gives 0 +/- 1.96 * sqrt(1/2), clamped to (-1, 1): the guard's value."
"chimera.eval.proportions.x_t_cdf__mutmut_21" = "t > 0 -> t >= 0. At t = 0 the tail is 0.5 and 1 - 0.5 == 0.5: same value on both branches."
"chimera.eval.proportions.x_newcombe_paired__mutmut_49" = "cross > n/2 -> cross >= n/2. At cross == n/2 the first branch gives cross - n/2 = 0 and the second gives 0: same phi."
"chimera.eval.proportions.x_newcombe_paired__mutmut_56" = "cross >= 0 -> cross > 0. At cross == 0 the else branch gives float(0) == 0.0: same phi."
"chimera.eval.proportions.x_newcombe_paired__mutmut_57" = "cross >= 0 -> cross >= 1. cross is an integer, so the only value that changes branch is 0, and float(0) == 0.0: same phi."
"chimera.eval.proportions.x_median_interval__mutmut_29" = "k < n -> k <= n. The loop breaks before k = n: reaching it needs P(Bin(n,1/2) <= n-1) = 1 - 2^-n <= alpha/2, impossible for alpha < 1."
# Clamps that no input can reach: Newcombe's bounds are inside [-1, 1] by construction.
"chimera.eval.proportions.x_newcombe_unpaired__mutmut_53" = "Lower clamp -1 -> -2. lower >= diff - (p1-l1) - (u2-p2) = l1 - u2 >= -1 because sqrt(a^2+b^2) <= a+b and the Wilson bounds are clamped: unreachable."
"chimera.eval.proportions.x_newcombe_unpaired__mutmut_58" = "Upper clamp 1 -> 2. upper <= u1 - l2 <= 1 by the same inequality: unreachable."
"chimera.eval.proportions.x_newcombe_paired__mutmut_118" = "Lower clamp -1 -> -2. With |phi| <= 1, sqrt(a^2 - 2 phi a b + b^2) <= a + b, so lower >= lt - ub >= -1: unreachable."
"chimera.eval.proportions.x_newcombe_paired__mutmut_123" = "Upper clamp 1 -> 2. upper <= ut - lb <= 1 by the same inequality: unreachable. (With phi_correction=False phi is the plain Pearson phi, still in [-1, 1].)"
