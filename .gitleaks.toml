# gitleaks reads this file from the repository root. Every default rule still applies; the allowlist
# below names values gitleaks flagged that are not credentials, each matched EXACTLY against the
# flagged secret (regexTarget "secret"), so a real key on the same line or in the same file is still
# caught. Add an entry only with the finding it answers and why the value cannot be a secret.
[extend]
useDefault = true

[allowlist]
description = "Flagged values that are not credentials"
regexTarget = "secret"
regexes = [
  # tests/test_the_server_token_never_reaches_a_child_process.py (generic-api-key): a fixture the
  # test asserts NEVER reaches a child process. It has to look like a token to test that.
  '''^per-launch-secret-0123456789abcdef$''',
  # tests/test_only_the_screen_approves_without_a_code.py (generic-api-key): the server-token
  # fixture the test proves can NOT approve without a code.
  '''^tok-0123456789$''',
  # tests/test_the_bridge_opens_sessions_in_the_project.py (generic-api-key): the bearer the fake
  # desktop record hands the MCP tool in a test that never sends a request anywhere.
  '''^tok-0123456789abcdef$''',
  # chimera/catalogs/pins.json, first commit of #984 (generic-api-key on "catalog/whatsapp-cloud-api.json",
  # sentry-access-token on "catalog/sentry.json"): the sha256 of two public catalogue files at a pinned
  # commit, written beside the file name. The file now keeps each digest on a line of its own, so new pins
  # do not need entries here; these two stay because a scan of that pull request reads the old commit.
  '''^bdae0e1b81c3d8b605bda2aa08d05f3b75801fe282aa31746451439a26ae81ee$''',
  '''^c7ddaef083eddd1aaac8f0736d8df470aef10940094d2aadf82ddfccd85c4dff$''',
  # apps/desktop/src/lib/hotkeys.ts (generic-api-key on `keys:`): the keyboard shortcut table, e.g.
  # `keys: "Ctrl+Shift+Tab"`. Modifier names joined by `+` ending in one key; no credential has
  # that shape.
  '''^(?:(?:Mod|Ctrl|Alt|Shift|Cmd|Meta|Option)\+)+(?:[A-Za-z0-9]|F[0-9]{1,2}|Tab|Enter|Escape|Esc|Space|Backspace|Delete|Home|End|PageUp|PageDown|Arrow(?:Up|Down|Left|Right)|[;,.=\-/\[\]`'])$''',
]

# This isolated adapter test uses only the listed dummy credentials; other files and values keep
# the default generic-api-key rule. The path and exact literals keep the exception local.
[[allowlists]]
description = "Fake web-search provider keys in the isolated adapter test"
paths = [
  '''^tests/test_web_search_uses_available_providers\.py$''',
]
regexTarget = "secret"
regexes = [
  '''^(?:fake-(?:tv|fc|exa|br|brave)|provider-secret|top-secret|tv-secret|fc-secret)$''',
]
