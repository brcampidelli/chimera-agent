[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chimera-agent"
version = "0.64.4"
description = "An open-source, self-evolving AI agent whose reasoning core is an LLM-Fusion engine (panel -> judge -> synthesizer)."
readme = "README.md"
# The bound stays, and its REASON changed. It used to track the litellm ceiling below (<1.92, which
# required Python <3.14); that ceiling has been lifted, and 1.96.2+ requires <3.15. What holds the
# bound now is narrower and checkable: the test matrix in `.github/workflows/ci.yml` runs 3.11, 3.12
# and 3.13. Declaring support for a version nothing runs would be a claim with no measurement behind
# it, which is the one kind of promise this project does not make.
#
# Lift it by ADDING 3.14 to that matrix and watching it pass — not by widening this line.
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "The Chimera Agent Authors", email = "chimeraagent01@gmail.com" }]
keywords = [
    "ai-agent",
    "llm",
    "llm-fusion",
    "self-evolving",
    "multi-agent",
    "autonomous-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Upstream shipped the wheels again, so the ceiling that existed for them is gone — and the FLOOR
    # is what replaces it. Checked against PyPI on 2026-09-03, release by release:
    #
    #     1.92.0  1.92.1        manylinux only        <- the reason the old ceiling existed
    #     1.93.0                manylinux only
    #     1.93.1  1.94.0  1.94.1  1.95.0    Windows, no macOS
    #     1.96.2 and every release after     Windows AND macOS AND manylinux AND musllinux
    #
    # So `<1.99`, which is what the bot proposed, is not safe: the range still admits 1.93.0, where a
    # macOS or Windows user falls back to the sdist and needs a Rust toolchain to install. The floor
    # has to sit at the first release of the CONTINUOUS run that covers both — 1.96.2 — and it is the
    # continuity that matters, not the newest version, because a resolver is free to pick any member
    # of the range.
    #
    # The ceiling is now an ordinary major bound rather than a platform workaround.
    "litellm>=1.96.2,<2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "croniter>=2.0",
    "textual>=0.60",
    # Full web browser (navigate/click/type/read_text/find) in the base, so anyone who installs or
    # clones Chimera gets it out of the box. The Chromium binary itself is NOT shipped by pip — the
    # browser tool auto-downloads it (~150MB) on first use (disable with CHIMERA_BROWSER_AUTO_INSTALL=0).
    "playwright>=1.40",
]

[project.optional-dependencies]
mcp = [
    # Ceiling, not preference — the same shape as the litellm pin above, and measured the same way.
    # `mcp>=1.0` resolves to 2.1.0 today, and 2.x removed the low-level decorator API that
    # `ChimeraMCP.build` is written against: `@server.list_tools()` raises
    # `AttributeError: 'Server' object has no attribute 'list_tools'`, so `chimera mcp-serve` dies
    # on start for anyone who installed the extra this week. The CLIENT half is fine on both — the
    # catalogue and the tool pool import `ClientSession` and `stdio_client`, which 2.x still has —
    # so this ceiling costs the client nothing and is what keeps the server working.
    #
    # Lift it by porting `ChimeraMCP.build` to the 2.x handler API, not by widening the range.
    "mcp>=1.0,<2",
]
# Native messaging platform adapters. Install to run `chimera serve --discord/--slack`;
# the core agent never requires it. (Telegram needs no extra — it is plain HTTP.)
messaging = [
    "discord.py>=2.3",
    "slack-sdk>=3.27",
]
# The youtube_transcript reference tool. Fragile by nature (YouTube blocks scraping), so
# it stays opt-in; every other reference tool needs no extra.
youtube = [
    # 1.0 removed the `get_transcript` classmethod the tool used to call; the floor says so, so a
    # resolver cannot hand us an API the code no longer speaks.
    "youtube-transcript-api>=1.0",
]
# Local speech-to-text for the transcribe_audio tool (offline/private). Heavy: pulls CTranslate2 +
# downloads a Whisper model on first use. Opt-in — without it, transcribe_audio uses the OpenAI
# Whisper API (needs an OpenAI key). Chimera orchestrates Whisper; it does not train an ASR model.
stt = [
    "faster-whisper>=1.0",
]
# Provider keys in the operating system's own vault — macOS Keychain, Windows Credential Manager,
# Linux SecretService — instead of in a `.env` any process running as this user can read. Opt-in,
# and it has to be: a container has no keychain and a server has no session bus, so a hard
# dependency would break the deployments that most need the file it replaces.
secrets = [
    "keyring>=25",
]
# Media download for the download_media tool: yt-dlp (1000+ sites, actively maintained — the robust
# alternative to pytube). Audio extraction also needs ffmpeg on PATH. Opt-in.
media-dl = [
    "yt-dlp>=2024.1",
]
# Local image generation for generate_image (CHIMERA_IMAGE_BACKEND=local). VERY heavy: pulls torch +
# diffusers and downloads multi-GB model weights; needs a real GPU. Opt-in — the hosted OpenAI path is
# the default. Chimera *runs* a diffusion model (FLUX.1-schnell, Apache-2.0); it does not train one.
imagegen-local = [
    "diffusers>=0.30",
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.30",
]
# Data-science libraries for the `data_analysis` skill's sandbox code (pandas + scikit-learn). Opt-in —
# the skill writes code that imports these; without them the generated script degrades to a clear
# ImportError. Chimera *uses* these libraries in the code sandbox; it never reimplements them.
data = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]
# Charting libraries for the `data_visualization` skill's sandbox code (matplotlib/seaborn = static
# PNG/SVG, plotly = interactive HTML). Opt-in — the skill writes code that imports these; without them
# the generated script degrades to a clear ImportError. Chimera *uses* these libraries; it never
# reimplements them.
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotly>=5.18",
]
# Static (PNG/SVG) rendering for the `render_chart` Vega-Lite tool. Heavy: vl-convert-python is a
# Rust+V8 binary wheel. Opt-in — HTML chart output needs NO extra (it embeds the spec via a CDN).
viz-vega = [
    "vl-convert-python>=1.3",
]
# Document ingestion for the read_document tool: any-format -> Markdown via MarkItDown.
# Opt-in so the core stays light; the tool gives an install hint when this isn't present.
documents = [
    "markitdown[docx,pptx,xlsx,pdf]>=0.1",
]
# Document WRITING for the create_document tool: a declarative JSON spec (headings, paragraphs,
# tables, sheets, slides) rendered to .docx/.xlsx/.pptx. Opt-in like its reading twin above; PDF needs
# no extra (chimera/tools/pdf_writer.py is stdlib). All three are MIT and pure Python over lxml, and
# openpyxl/python-pptx were already in the lock through markitdown — python-docx is the new name.
documents-out = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]
# Batteries-included: everything a general-purpose assistant needs in one install — messaging
# adapters, MCP, documents (docx/pdf/xlsx→md), media download (yt-dlp; audio also needs ffmpeg on
# PATH), local speech-to-text (faster-whisper), data analysis (pandas/scikit-learn) and charts
# (matplotlib/seaborn/plotly), plus YouTube transcripts. Deliberately EXCLUDES the GPU-heavy,
# multi-GB extras (`imagegen-local`, `train`) — install those explicitly if you have a GPU.
# One command for "I want all the features": pip install 'chimera-agent[full]'.
full = [
    "chimera-agent[messaging,mcp,documents,documents-out,media-dl,stt,data,viz,youtube,secrets]",
]
# Back-compat alias: the browser (playwright) is now a CORE dependency, so `pip install
# 'chimera-agent[browser]'` still works but installs nothing extra. The Chromium binary is
# auto-downloaded on first browser use.
browser = []
# Observability: opt-in OpenTelemetry. With this installed and CHIMERA_OTEL=1 (or the standard
# OTEL_EXPORTER_OTLP_ENDPOINT set), Chimera exports OTLP spans (tool calls) + metrics (tokens/cost)
# to any OTLP backend (Jaeger/Tempo/Grafana). Off and zero-overhead without it.
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# Standard-benchmark grounding: the terminal-bench harness for the honest weak-model-lift A/B.
# Opt-in and heavy (Docker-based); the adapter gives an install hint when absent. The A/B stats
# engine (chimera bench-compare) needs no extra. Marker: terminal-bench requires Python >=3.12,
# so it's excluded on 3.11 rather than breaking resolution (the adapter hints to install it).
bench = [
    "terminal-bench>=0.2; python_version >= '3.12'",
]
# Desktop app backend: the FastAPI/SSE API that the React frontend (apps/desktop) talks to.
# Opt-in — the core CLI/gateway never needs it (the stdlib http.server still serves messaging +
# webhooks). `chimera app` starts this and serves the built SPA same-origin. sse-starlette gives
# the token/tool/done event stream; uvicorn is the ASGI server.
desktop = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2.0",
    # Multipart parsing for the two upload endpoints (attachments, dictation). FastAPI raises at
    # REQUEST time without it, not at import, so a missing dependency here would ship as a working
    # app whose attach button fails the first time anyone presses it.
    "python-multipart>=0.0.9",
    # CPU and memory for the resource panel. Here rather than in the core because it is a compiled
    # package, and making the agent refuse to start where that wheel does not build would trade the
    # whole product for a telemetry readout. Absent, the panel says "unavailable" and names this.
    "psutil>=5.9",
]
# Opt-in model evolution (LoRA/SFT/DPO). Heavy + GPU-bound — never required by the
# agent; install only to run a `chimera evolve recipe` training script.
train = [
    "trl>=0.9",
    "peft>=0.11",
    "transformers>=4.40",
    "datasets>=2.19",
    "accelerate>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "types-croniter>=2.0",
    # Mutation testing for the "if this is wrong, we're lying" modules — see MUTATION.md.
    # POSIX-only (it forks per mutant): on Windows run it under WSL. CI runs it on Linux.
    "mutmut>=3.3",
    # The create_document tests OPEN what the tool wrote and read the cell, slide and paragraph
    # back. Skipped when the libraries are absent, they would pass on every machine that never
    # installed the extra — a suite that says nothing in the shape of a suite that passed.
    "chimera-agent[documents-out]",
]

[project.scripts]
chimera = "chimera.cli.main:app"

[project.urls]
Homepage = "https://chimeraagent.space"
Documentation = "https://chimeraagent.space/en/docs/"
Repository = "https://github.com/brcampidelli/chimera-agent"
Issues = "https://github.com/brcampidelli/chimera-agent/issues"
Changelog = "https://github.com/brcampidelli/chimera-agent/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["chimera"]
# The built desktop SPA (apps/desktop/dist) is gitignored but must ship in the wheel so that a
# `pip install chimera-agent[desktop]` user actually gets the UI (not just the API). `artifacts`
# un-ignores it for file selection; `force-include` maps it into the package as chimera/_desktop_dist,
# where the CLI's `chimera app`/`serve --ui` looks for it when no source-checkout dist is present.
artifacts = ["apps/desktop/dist/**"]

# The force-include that maps the built SPA into the wheel is declared in `hatch_build.py`, not here,
# so it applies only when the SPA has actually been built. As a static table it pointed at a
# gitignored path and broke every from-source build (`pip install -e .`, `uv sync`, all of CI) with
# `Forced include not found`. See that file for the full rationale.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# `uv build` builds the sdist first, then builds the wheel *from that sdist*. The wheel force-include
# points at `apps/desktop/dist`, so that path must exist inside the sdist — otherwise the
# wheel-from-sdist step ships a UI-less wheel. Keep the built SPA in the sdist at its original path
# (it's gitignored, so `artifacts` un-ignores it). `hatch_build.py` is tracked, so the sdist picks it
# up by default — the wheel-from-sdist step needs the hook present to re-apply the include.
[tool.hatch.build.targets.sdist]
artifacts = ["apps/desktop/dist/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Preserved forensic evidence: workspaces kept because an arm modified its own grading test. These
# files are what the agent actually wrote and must stay byte-for-byte as found — linting them is
# meaningless and `--fix` would rewrite the evidence.
extend-exclude = ["bench/**/tampered_*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

# Do not type-check inside third-party packages we merely import. This surfaced when the `stt` extra
# pulled numpy in: its shipped stubs use `type` statements, which are Python 3.12 syntax, and we
# check against 3.11 — so an optional dependency of an optional feature could fail the type gate of
# the whole project. What a library's own stubs claim about itself is not a fact about our code.
# `diffusers` is here for the same reason: its `from_pretrained` is untyped, and the `imagegen-local`
# extra is a GPU-only path the core never takes.
[[tool.mypy.overrides]]
module = ["numpy.*", "faster_whisper.*", "ctranslate2.*", "onnxruntime.*", "markitdown.*", "diffusers.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The default run is hermetic (no network). Integration tests hit a real
# provider and are opt-in via `-m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: live test that calls a real provider API (needs OPENROUTER_API_KEY)",
]

# Mutation testing — proves the tests for the modules that, if wrong, make Chimera LIE, or let it
# act where it should have asked. Scope is deliberately narrow (see MUTATION.md): mutating all of
# `chimera` would take hours and nobody would read the result. `only_mutate` is the real scope gate;
# `source_paths` just bounds the tree mutmut walks.
#
# VIABILITY: mutmut re-runs tests per mutant, so the test universe below is restricted to the test
# files for these modules instead of the full suite. tests/test_api.py
# is deliberately EXCLUDED: it alone takes ~65s, and every runs.py entry point it covers
# (build_receipt / append_run / load_runs) is tested directly by tests/test_runs.py.
[tool.mutmut]
source_paths = ["chimera"]
only_mutate = [
    "chimera/eval/paired.py",       # McNemar/Wilson stats behind every published benchmark number
    # The interval arithmetic itself (Wilson, Newcombe, Bonett-Price, McNemar, t, TOST). Until study
    # 30 it was copied into ~40 bench scripts and had drifted in four of them; one home is only worth
    # having if a wrong digit in it is caught, so it sits inside the gate.
    "chimera/eval/proportions.py",
    "chimera/api/version_api.py",   # the update-available signal
    "chimera/core/verify.py",       # the pass/fail authority of verify-or-revert
    "chimera/evolution/diff_gate.py",  # the "did it actually change anything" gate
    "chimera/api/runs.py",          # receipt building: the reverted/success flags the UI reports
    # Security enforcement, not just credibility: these decide whether something the model chose
    # happens on YOUR machine or reaches someone else. A silent bug here is a security bug, strictly
    # worse than a wrong benchmark number — so they belong inside the one gate that proves the tests
    # can actually fail.
    "chimera/sandbox/confirm.py",   # the host-exec gate: run on the host, or refuse
    "chimera/governance/audit.py",  # the hash-chained decision log, and verify() that calls it intact
    "chimera/governance/recipient.py",  # "was this address ever seen?" before a send
    "chimera/governance/ledger.py",     # taint: what the run read, and what that narrows
    "chimera/governance/ledger_tool.py",  # the wrapper that applies the narrowing to every tool call
    "chimera/governance/shared_approval.py",  # one answer per proposal across a crew's workers
    "chimera/governance/policy.py",     # allow / ask / deny for a tool call
]
# The tests mutmut runs. mutmut maps each test to the functions it calls and re-runs only those per
# mutant, so a test file that is NOT listed here does not exist as far as the gate is concerned —
# however well it tests the module. That is how the gate rotted between 2026-07 and 2026-10: the
# list was the eight files written alongside the original scope, the modules grew new code tested
# in NEW files, and the weekly run reported ~450 survivors that the full suite in fact kills.
# tests/test_the_mutation_gate_sees_the_tests_of_its_modules.py now fails when a test file naming an
# in-scope module — by name, or through a bench/ runner it loads (test_run_paired.py drives paired.py
# that way) — is neither listed here nor excluded there with a reason (the slow ones are).
pytest_add_cli_args_test_selection = [
    "tests/test_a_clone_the_task_never_named_is_asked_about.py",
    "tests/test_a_command_that_can_only_read.py",
    "tests/test_a_cut_turn_is_never_a_silent_normal_one.py",
    "tests/test_a_cut_turn_is_recorded_on_every_path_not_only_the_main_one.py",
    "tests/test_a_decision_carries_its_number.py",
    "tests/test_a_declared_destination_is_not_a_way_out.py",
    "tests/test_a_deferred_tool_is_still_governed.py",
    "tests/test_a_denylist_bypass_battery.py",
    "tests/test_a_failed_send_is_not_remembered_as_sent.py",
    "tests/test_a_failure_has_a_class_before_it_has_a_retry.py",
    "tests/test_a_fenced_failure_is_still_a_failure.py",
    "tests/test_a_format_change_is_not_a_corrupt_file.py",
    "tests/test_a_generated_test_run_is_recorded_as_spec_test.py",
    "tests/test_a_guarded_run_outside_a_conversation_carries_the_owners_hooks.py",
    "tests/test_a_hooks_ask_is_not_answered_by_approve_everything.py",
    "tests/test_a_pack_that_cannot_be_trusted_keeps_the_owners_narrowing.py",
    "tests/test_a_patch_that_adds_a_sink_is_held_for_a_person.py",
    "tests/test_a_plan_gate_only_ever_adds_a_stop.py",
    "tests/test_a_policy_review_on_the_code_screen_asks_with_a_card.py",
    "tests/test_a_precedent_learned_clean_does_not_answer_tainted.py",
