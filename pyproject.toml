    "tests/test_a_read_only_batch_of_tool_calls_runs_together.py",
    "tests/test_a_receipt_carries_every_field_the_attempt_had.py",
    "tests/test_a_recipient_nobody_mentioned_is_noticed.py",
    "tests/test_a_record_only_rule_never_costs_the_verdict.py",
    "tests/test_a_refused_ask_is_a_card_not_a_shrug.py",
    "tests/test_a_research_answer_cites_only_what_it_read.py",
    "tests/test_a_resolved_patch_that_edits_tests_is_read_twice.py",
