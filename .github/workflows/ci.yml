name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly mutation-testing run (Mondays 06:00 UTC). The mutation job self-gates to this + manual
    # dispatch; every other job below runs on push/PR as usual.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs everywhere EXCEPT main. On a branch, only the tip matters and killing the
  # older run saves runner time. On main every commit is a candidate to release from, and a commit
  # whose run was cancelled by the next push keeps whatever verdict it had — usually none. Pushing
  # twice in an hour would then leave the first commit permanently unverified while `main` still
  # looked green, because the green belonged to a different tree.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege, declared here rather than inherited. Without this block the token carries whatever
# the repository default happens to be — a setting that lives in the web UI, is invisible in review,
# and can be widened by someone who never reads this file. CI only ever needs to read the tree.
#
# Two related invariants that are currently correct and are cheap to break by accident:
#   * No workflow uses `pull_request_target`. That trigger runs a fork's code with the BASE repo's
#     token and secrets; a PR that introduces one is refused by default (see AGENTS.md).
#   * Nothing reachable from `pull_request` reads a repository secret. `integration` and
#     `quality-bench` hold the API keys and are gated to push-on-main / manual dispatch.
permissions:
  contents: read

jobs:
  quality:
    name: lint · type-check · test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # Include the desktop extra so mypy sees FastAPI's real types (without it, strict mode flags
        # every route decorator as untyped) and the desktop API tests actually run instead of skipping.
        run: uv sync --extra dev --extra desktop

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (strict type-check)
        run: uv run mypy chimera

      - name: Pytest
        run: uv run pytest -q

  quality-windows:
    name: test (windows)
    timeout-minutes: 30
    runs-on: windows-latest
    needs: quality
    # The suite has never run on Windows, and the day it first did it failed three times — all from
    # the same family of Unix assumption:
    #
    #   * `CommandVerifier` treated exit 127 as "command not found". `cmd.exe` answers 1, which is
    #     also every test runner's "your tests failed", so a missing verify command was reported as
    #     a FAILED verification: the attempt reverted and the receipt recorded a test failure that
    #     never happened. A product bug, on the gate that decides keep-or-revert.
    #   * A spec fixture used `true` / `false` as its check. Neither exists in `cmd.exe`, so a
    #     project that was supposed to be already-satisfied sat at `running` forever.
    #
    # None of it was visible because `quality` is Ubuntu-only and the three-OS matrix below is a
    # clean install plus an import — it proves the package installs, not that it works. Half this
    # project's users are on Windows and the whole IDE roadmap (spawning agent CLIs, language
    # servers, `npx.cmd`, `CREATE_NO_WINDOW`) lands there first.
    #
    # One Python version, tests only: ruff and mypy read the same source on every OS, so running
    # them again here would buy a slower CI and nothing else.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra desktop

      - name: Pytest
        run: uv run pytest -q

  integration:
    name: live integration (real provider)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: quality
    # Only on direct pushes to main (not fork PRs), where the secret is available.
    # The test self-skips when the secret is unset, so this job is green either way.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # `desktop` is needed even though this job only runs `-m integration`: pytest IMPORTS every
        # test module before the marker filter selects any, so the FastAPI-dependent suites make
        # collection die with ModuleNotFoundError before a single integration test is chosen.
        run: uv sync --extra dev --extra mcp --extra desktop

      - name: Integration smoke test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run pytest -m integration -q

  install-smoke:
    name: clean pip install (${{ matrix.os }} · py${{ matrix.python-version }})
    # `quality` uses `uv sync` against the committed uv.lock — a pinned resolution, identical on every
    # run. This job instead does a FRESH `pip install`, which re-resolves from PyPI and can land on a
    # version lacking a wheel for this OS/Python, falling to an sdist that needs a compiler. That is not
    # hypothetical: litellm 1.92 went manylinux-only, which is why the dependency now carries a ceiling.
    # Testing the extremes (Windows/macOS × oldest+newest supported Python) catches that class before a
    # user hits it. The wheel is pure-Python, so success here means "a plain `pip install` just works".
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fresh pip install of the desktop extra (no uv, no lockfile)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[desktop]"
      - name: Import smoke (core + desktop API) + CLI entrypoint
        run: |
          python -c "import chimera, chimera.api.app; print('chimera', chimera.__version__, 'import OK')"
          chimera --help

  desktop:
    name: desktop app (API types drift + tests + build)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python deps (the desktop extra provides FastAPI for the schema)
        run: uv sync --extra dev --extra desktop

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Regenerate the OpenAPI schema + TypeScript types
        run: |
          uv run python -m chimera.api.schema_dump > apps/desktop/openapi.json
          npm --prefix apps/desktop run gen:api

      # The same idea one layer out: the documentation site renders the command reference from
      # this dump, so a new command with no help text, or a renamed flag, must not reach a
      # published page describing the CLI as it was last release.
      # What a diff BRINGS IN, which nothing else here asks. `gitleaks` runs over the full history
      # and the three CVE audits watch what is installed — every one of them asks whether something
      # is getting OUT, or whether a dependency is known-bad. This repository is public, takes pull
      # requests from anyone, and auto-merges by policy: a line adding a `curl` to a URL shortener
      # inside `.github/workflows/` or `install.sh` passes lint, mypy, pytest, gitleaks and all
      # three audits without touching a thing any of them look at.
      #
      # `--fail-on high`, not `medium`: these are heuristics with legitimate uses, and a gate that
      # stops a build over a shortened link in a comment is a gate somebody switches off.
      - name: What this diff brings in
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          uv run python scripts/pr_intent_scan.py --base "origin/${{ github.base_ref }}" --fail-on high

      - name: Regenerate the CLI snapshot
        run: uv run python -m chimera.cli.schema_dump > chimera/_cli_snapshot.json

      - name: Fail if the CLI snapshot is stale
        run: |
          if ! git diff --quiet -- chimera/_cli_snapshot.json; then
            echo "::error::The CLI reference is out of date. Run this and commit the result:"
            echo "  python -m chimera.cli.schema_dump > chimera/_cli_snapshot.json"
            git --no-pager diff --stat -- chimera/_cli_snapshot.json
            exit 1
          fi

      # The grouping, which the documentation site renders. It used to live in the site's
      # repository, so the check that every command lands in a theme could only run at DEPLOY time
      # — after the release. Three times it caught the same omission and three times the download
      # page sat on the previous version until somebody read a red deploy. `tests/` asserts the
      # completeness on the pull request that adds the command; this asserts the file the site
      # actually reads is what the module says.
      - name: Regenerate the CLI theme grouping
        run: uv run python -m chimera.cli.themes_dump > chimera/_cli_themes.json

      - name: Fail if the CLI theme grouping is stale
        run: |
          if ! git diff --quiet -- chimera/_cli_themes.json; then
            echo "::error::The command reference grouping is out of date. Run this and commit it:"
            echo "  python -m chimera.cli.themes_dump > chimera/_cli_themes.json"
            git --no-pager diff --stat -- chimera/_cli_themes.json
            exit 1
          fi

      # The drift gate: if the committed schema/types differ from a fresh regeneration, someone changed
      # a backend response model without running `gen:api`. Fail loudly with the fix.
      - name: Fail if the generated API types are stale
        run: |
          if ! git diff --quiet -- apps/desktop/openapi.json apps/desktop/src/lib/api-schema.ts; then
            echo "::error::Desktop API types are out of date. Run these and commit the result:"
            echo "  python -m chimera.api.schema_dump > apps/desktop/openapi.json"
            echo "  npm --prefix apps/desktop run gen:api"
            git --no-pager diff -- apps/desktop/openapi.json apps/desktop/src/lib/api-schema.ts
            exit 1
          fi

      - name: Component tests (Vitest + Testing Library — guards user-visible UI behaviour)
        run: npm --prefix apps/desktop run test

      - name: Build the frontend (tsc + vite — proves the UI matches the generated types)
        run: npm --prefix apps/desktop run build

  desktop-shell:
    # The Tauri shell has Rust tests and nothing ran them — not this file, not the release workflow.
    # `desktop-release` compiles the crate, so a *compile* error was always caught at release time; a
    # failing assertion was caught nowhere, on any branch, ever. The tests it runs guard the startup
    # path (the sidecar's stderr is captured, a dead backend leaves a report, the tail is bounded),
    # which is precisely the code a user hits when nothing else works, so a guard that only runs on
    # the author's laptop is the same defect one layer up.
    name: desktop shell (Rust tests)
    timeout-minutes: 30
    # WINDOWS, and for two reasons that point the same way.
    #
    # The flake: on ubuntu this job needs `apt-get install libwebkit2gtk-4.1-dev …`, and that step
    # hung on three consecutive runs (#104, #106, #107) — each killed at exactly 25m00s by the old
    # timeout, which GitHub reports as `cancelled` rather than `failure`, so the verdict job
    # correctly called it infrastructure and each PR needed a manual re-run. The usual cause is the
    # dpkg lock held by unattended-upgrades at runner boot. Windows needs no system deps at all:
    # WebView2 ships with the OS, which is why `desktop-release.yml` gates its apt step to ubuntu.
    #
    # The better reason: this crate's bugs are Windows bugs. `windows_subsystem = "windows"` is what
    # made a panic write to a stderr that does not exist, which is the failure the tests in
    # `main.rs` exist to prevent — and on Linux that code path is not the one that runs. Testing the
    # startup path on the platform where it broke is worth more than testing it where it never did.
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # Two placeholders, because `tauri-build` resolves the bundle manifest before it compiles
      # anything and refuses on either: `frontendDist` points at ../dist, and `bundle.resources`
      # globs the PyInstaller output, which only the release workflow produces. Building the real
      # SPA and freezing the real backend here would duplicate two other jobs for no gain — these
      # tests never load a page and never launch the sidecar; they exercise the code that runs when
      # launching it FAILS.
      #
      # `shell: bash` because the runner's default here is pwsh, where `mkdir -p` is a parse error.
      - name: Placeholders the build script insists on
        shell: bash
        run: |
          mkdir -p apps/desktop/dist apps/desktop/src-tauri/sidecar-dist/chimera-backend
          touch apps/desktop/dist/index.html
          touch apps/desktop/src-tauri/sidecar-dist/chimera-backend/chimera-backend.exe

      - name: cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  mutation:
    name: mutation testing (critical modules)
    timeout-minutes: 120
    runs-on: ubuntu-latest
    # Slow (hundreds of mutants). Weekly + on demand only — NOT on every push/PR. The gate is that
    # every surviving mutant is a justified allowlist entry (see MUTATION.md / scripts/mutation_gate.py).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Placeholder SPA dist
        # Hatchling force-includes apps/desktop/dist for the [desktop] packaging; the mutation gate
        # only touches chimera/*.py, so a placeholder satisfies the include without building the UI.
        run: mkdir -p apps/desktop/dist && touch apps/desktop/dist/.gitkeep

      - name: Install deps (dev provides mutmut; desktop provides FastAPI for the api modules)
        run: uv sync --extra dev --extra desktop

      - name: Run mutmut on the critical modules
        # Mutates only the five modules in [tool.mutmut].only_mutate, against their focused tests.
        # mutmut always exits 0 — the gate below is what turns survivors into a failure.
        run: uv run mutmut run

      - name: Gate — every survivor must be a justified allowlist entry
        run: uv run python scripts/mutation_gate.py

  supply-chain:
    name: supply chain (secrets · known CVEs)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks needs history to scan commits, not just the checked-out tree. A secret that was
          # committed and then deleted is still a leaked secret.
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # THREE ecosystems, because this repository ships three lockfiles and the job is called "known
      # CVEs". It audited only Python for its whole life. On 2026-08-17 Dependabot was reporting
      # three open alerts and the highest — a `high` in js-yaml, reachable from the desktop
      # package-lock — sat in the npm tree, which nothing in CI looked at, while this job reported
      # green. A gate named for a property it covers one third of is worse than no gate: it is a
      # green light for the two thirds nobody is checking.
      #
      # All three are ADVISORY, for the reason pip-audit already gave: they fail on any CVE in any
      # transitive package, including ones with no fix released, which would make red the normal
      # state and teach everyone to ignore it. Dependabot moves versions; this makes what is known
      # visible in the run instead of discovered by a user.
      #
      # Advisory via `continue-on-error` ALONE, with no trailing `|| true`. Both together is one too
      # many: `continue-on-error` already keeps the job green, and the `|| true` on top additionally
      # hides the step, so a misspelled flag or a missing binary renders exactly like a clean audit.
      # A scanner that cannot fail cannot report either, and the whole point of this job is that
      # somebody sees the output.
      - name: Known vulnerabilities — Python (pip-audit)
        continue-on-error: true
        run: |
          uvx pip-audit --version
          uv export --format requirements-txt --no-hashes --no-emit-project > /tmp/reqs.txt
          uvx pip-audit --requirement /tmp/reqs.txt --strict

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Known vulnerabilities — npm (the desktop tree ships in the [desktop] extra)
        continue-on-error: true
        working-directory: apps/desktop
        # `--package-lock-only`: audit the committed resolution, not whatever a fresh install picks.
        # The lockfile is what users get; auditing anything else answers a different question.
        run: npm audit --package-lock-only

      - name: Install the desktop tree (audit signatures needs a real install)
        working-directory: apps/desktop
        # `npm audit signatures` reads the installed tree, not the lockfile. Measured: without
        # node_modules it exits 1 with "found no dependencies to audit" — loud rather than a silent
        # pass, which is the right failure, but it still has to actually run to be worth having.
        run: npm ci

      # NOT advisory, unlike the three above, and the difference is the point.
      #
      # A CVE advisory can appear on a package with no fix released — nothing the repository can do
      # that day, which is why those three only report. A signature mismatch is different in kind:
      # it says the tarball in the registry is not the one its publisher signed, and there is no
      # version of that which is acceptable to build on.
      #
      # This closes the one window the hashes do not. `uv.lock` carries 2352 hashes and
      # `package-lock.json` 495 integrity fields, so tampering AFTER the lock was written is already
      # caught — but a tarball substituted at the moment the lock was GENERATED hashes cleanly
      # forever after. Registry signatures are what check that.
      #
      # Narrow-window hygiene, not a new capability — worth saying plainly rather than announcing as
      # a security feature. `--ignore-scripts` deliberately NOT added: it would risk the Tauri/vite
      # build, and lifecycle scripts reaching a publish token are already blocked architecturally by
      # the privilege split in publish.yml.
      - name: Registry signatures (the window a hash cannot close)
        working-directory: apps/desktop
        run: npm audit signatures --omit=dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Known vulnerabilities — Rust (the Tauri shell)
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit --file apps/desktop/src-tauri/Cargo.lock

  verdict:
    name: verdict (what red actually means)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        quality,
        quality-windows,
        integration,
        install-smoke,
        desktop,
        desktop-shell,
        mutation,
        supply-chain,
      ]
    steps:
      # A run can go red without anything failing. On 2026-08-06 two of the three `quality` matrix
      # jobs were created, never assigned a runner, and were cancelled 15 minutes later; the third
      # ran the whole suite and passed. GitHub reported `failure`, and in the branch-protection UI
      # that is indistinguishable from a broken test.
      #
      # This does NOT turn that red into green. A job that never ran told us nothing about the code,
      # so the verdict stays red — but it says WHICH kind of red, because the two demand opposite
      # responses: a failure means read the log and fix it, a cancellation means re-run and change
      # nothing. Conflating them teaches people that red is negotiable, which is the expensive part.
      - name: Classify
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          failed=0; cancelled=0
          # if/case rather than `[ test ] && incr`: GitHub runs `run:` steps under `bash -e`, where a
          # bare AND-list whose test is false is itself a failing statement and aborts the script. The
          # job would then exit 1 on the first result that did not match — a verdict step that reports
          # failure BY failing is the exact confusion this job exists to remove.
          for r in $RESULTS; do
            case "$r" in
              failure) failed=$((failed + 1)) ;;
              cancelled) cancelled=$((cancelled + 1)) ;;
            esac
          done

          if [ "$failed" -gt 0 ]; then
            {
              echo "## Red: something actually failed"
              echo ""
              echo "$failed job group(s) reported \`failure\`. Read the log — a re-run will not help."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$cancelled" -gt 0 ]; then
            {
              echo "## Red: infrastructure, not the code"
              echo ""
              echo "$cancelled job group(s) were \`cancelled\` and none failed — the usual cause is a"
              echo "job that never got a runner. Re-run the cancelled jobs:"
              echo ""
              echo '```bash'
              echo "gh run rerun ${{ github.run_id }} --failed"
              echo '```'
              echo ""
              echo "If it cancels again at the same place, it is a pattern rather than a hiccup and"
              echo "the queue wait is worth investigating instead of retrying."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "## Green" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing failed and nothing was cancelled." >> "$GITHUB_STEP_SUMMARY"
