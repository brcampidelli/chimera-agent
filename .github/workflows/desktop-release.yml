name: Build desktop installers

# Builds the SELF-CONTAINED native desktop app (Tauri shell + a PyInstaller-frozen backend sidecar)
# for Windows / macOS / Linux and attaches the installers to the GitHub Release. The INSTALLERS are
# still UNSIGNED (no code-signing cert), so first-run shows a SmartScreen/Gatekeeper warning — that is
# expected and called out in the release notes. What IS signed here is the UPDATER: with
# `bundle.createUpdaterArtifacts: true` the build emits per-platform update bundles + Minisign `.sig`
# files (using the TAURI_SIGNING_PRIVATE_KEY secret), and a final job assembles a `latest.json` manifest
# and publishes it to the Release so the app's in-place auto-updater can find + verify updates.
#
# The release is created with `--latest=false` and PROMOTED by the last job, once latest.json is
# attached. `releases/latest/download/latest.json` is the updater's endpoint, so a release that
# becomes "latest" before its manifest exists breaks auto-update for everyone until the build ends.
#
# A manual `gh workflow run desktop-release.yml` is a full DRY RUN: it builds every platform, signs,
# and assembles latest.json as an artifact WITHOUT publishing anything. Do that before every release
# (see RELEASING.md) — the manifest path used to be release-only, which is why v0.32.0-v0.32.2 were
# three patch releases spent debugging it in public.
#
# This CI is the ONLY verifier of the native build: it is not smoke-tested on the maintainer's machine
# (no local MSVC/Rust toolchain). The PyPI wheel path is unaffected — the frozen sidecar and the
# updater live only in these installers, never in the wheel.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write # attach installer assets to the release

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.bundles }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            updater_target: windows-x86_64
          - os: macos-latest
            bundles: app,dmg
            updater_target: darwin-aarch64
          # Intel Macs. `macos-latest` is arm64-only, so without this an Intel Mac literally cannot
          # install (an aarch64 dmg won't run) and gets no updater entry. The frozen PyInstaller
          # sidecar is arch-specific, so a "universal" Tauri build wouldn't help — the backend must
          # be built ON an Intel runner. NOTE: macos-13 was retired (Dec 2025); `macos-15-intel` is
          # the last x86_64 image and is scheduled to go away ~Aug 2027, after which GitHub Actions
          # drops macOS x86_64 entirely. Revisit before then.
          - os: macos-15-intel
            bundles: app,dmg
            updater_target: darwin-x86_64
          - os: ubuntu-latest
            bundles: appimage,deb
            updater_target: linux-x86_64
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Build the SPA (into apps/desktop/dist)
        run: npm --prefix apps/desktop run build

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      # The frozen sidecar bundles the real backend (chimera + [desktop] extra) + PyInstaller. Freeze
      # it BEFORE the Tauri build, since tauri.conf bundles src-tauri/sidecar-dist as a resource.
      # Editable install (uv sync) matches the locally-proven freeze: --collect-data chimera reads the
      # source tree (no _desktop_dist) and --add-data supplies the built SPA — no double-include clash.
      - name: Install the backend (editable) + PyInstaller
        run: |
          # `documents` ships (28 MB, and it makes attaching a PDF work out of the box). `stt`
          # does NOT: it is ~300 MB of native code, and the largest single piece is PyAV bundling a
          # complete ffmpeg — x264, x265, AV1 encoders — to decode microphone audio. A video codec
          # suite in every download so that dictation can avoid one API call is the wrong trade, and
          # on Linux the AppImage bundler then copies much of it a second time.
          # `mcp` ships too, and it is small (pure Python, no native code) — without it the MCP
          # screen and its whole catalogue are decoration: every server fails to connect in the
          # packaged app, and the failure reads as "did not become ready" rather than as a missing
          # dependency. Verified by searching the frozen binary for the SDK's module names, with
          # `chimera.integrations.mcp_client` and `litellm.utils` as controls to prove the search
          # finds what IS there.
          uv sync --extra desktop --extra documents --extra stt --extra mcp
          uv pip install pyinstaller

      - name: Freeze the backend sidecar
        run: uv run --no-sync python apps/desktop/src-tauri/build_sidecar.py

      - name: Verify the frozen sidecar exists
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            test -f apps/desktop/src-tauri/sidecar-dist/chimera-backend/chimera-backend.exe
          else
            test -f apps/desktop/src-tauri/sidecar-dist/chimera-backend/chimera-backend
          fi

      # Ask the BINARY what version it is, rather than trusting that the freeze carried it. Every
      # installer this project has published reported "0.0.0+source" in the app's footer, because
      # PyInstaller does not collect a package's .dist-info unless told to and nothing here could
      # notice: the version is only observable by running the artefact, and the artefact is only ever
      # built in CI. That is the definition of a check that belongs in the pipeline.
      #
      # Silencing the footer was the visible half. The invisible half is that `/api/version` compares
      # versions and refuses to compare an unparseable one — so the in-app "update available" notice
      # was off for every installed user, for every release.
      - name: The frozen sidecar knows its own version
        shell: bash
        run: |
          BIN=apps/desktop/src-tauri/sidecar-dist/chimera-backend/chimera-backend
          # `if`, not `[ … ] && …`: this step runs under `bash -e`, where a false test on the last
          # (or any) command is a failed step. The one-liner would abort the job on every non-Windows
          # runner, which is the kind of green-to-red that reads as a broken build rather than a
          # broken condition.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN="$BIN.exe"; fi
          VERSION=$("$BIN" --version)
          echo "frozen sidecar reports: $VERSION"
          case "$VERSION" in
            0.0.0*|"")
              echo "::error::the freeze lost the package metadata — the app would report $VERSION"
              exit 1
              ;;
          esac
          # And that it is the RIGHT version, not merely a non-zero one. The rule above was written
          # for `0.0.0+source` and encodes "not zero"; a sidecar stamped with the PREVIOUS release
          # passes it, which is the way a version is actually wrong — plausibly, not obviously.
          # Empty on a manual dispatch, where there is no release to compare against.
          ESPERADA="${{ github.event.release.tag_name }}"
          ESPERADA="${ESPERADA#v}"
          if [ -n "$ESPERADA" ] && [ "$VERSION" != "$ESPERADA" ]; then
            echo "::error::the frozen sidecar reports $VERSION inside a $ESPERADA release"
            exit 1
          fi

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Linux system deps for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Installers stay unsigned (no cert), but the UPDATER artifacts ARE signed here: these two secrets
      # let the bundler produce the Minisign `.sig` files next to each update bundle. Without them the
      # build would fail once createUpdaterArtifacts is on, so they must be present on release runs.
      - name: Build the Tauri app (signed updater artifacts)
        # `--verbose` on Linux only, and it is not decoration: when the AppImage bundler fails,
        # Tauri reports `failed to run linuxdeploy` and discards linuxdeploy's own stderr, so the
        # log names the tool that failed and nothing about why. One guess was already spent on a
        # swallowed error; this makes the next diagnosis read the actual message.
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            # linuxdeploy resolves each ELF file's NEEDED entries against the SYSTEM library paths,
            # while wheels built for manylinux keep their natives inside the package under mangled,
            # content-hashed names. It reports "could not find" a file sitting next to the library
            # that needs it, and aborts. Kept after the speech stack left, because numpy and pillow
            # package their natives the same way and would hit it the day something else pulls one
            # in. Absolute paths: relative ones were set correctly and had no effect, since
            # linuxdeploy runs from its own working directory.
            LIBS=$(find "$PWD/apps/desktop/src-tauri/sidecar-dist" -type d -name '*.libs' -printf '%p:')
            export LD_LIBRARY_PATH="${LIBS}${LD_LIBRARY_PATH}"
            echo "resolver path: $LD_LIBRARY_PATH"
            npm --prefix apps/desktop run tauri build -- --verbose --bundles ${{ matrix.bundles }}
          else
            npm --prefix apps/desktop run tauri build -- --bundles ${{ matrix.bundles }}
          fi
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # AppImage only. `linuxdeploy` walks the whole AppDir, finds every ELF file and runs
          # `strip` on it — which now includes the native libraries the speech model runs on
          # (ctranslate2, onnxruntime) and the PyInstaller-frozen backend itself. Those are not
          # ordinary shared objects, strip fails on them, and the bundler reports only "failed to
          # run linuxdeploy" with the real reason swallowed.
          #
          # Stripping buys a few megabytes on a bundle that is already hundreds. Not stripping buys
          # a Linux build that exists. Set for every OS because it is inert where linuxdeploy does
          # not run, and a conditional here would be a second thing to keep in sync.
          NO_STRIP: "true"

      # BOTH macOS jobs (arm64 + Intel) emit an updater bundle named plainly `Chimera.app.tar.gz` —
      # the nsis (.exe) and AppImage names already carry their arch, but this one doesn't. Two jobs
      # uploading the same filename would collide as release assets and make both manifest entries
      # (darwin-aarch64 / darwin-x86_64) point at one file. Stamp the arch in before upload.
      - name: Stamp the arch into the macOS updater artifact
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.updater_target }}
        run: |
          set -euo pipefail
          d=apps/desktop/src-tauri/target/release/bundle/macos
          arch="${TARGET#darwin-}" # aarch64 | x86_64
          for f in "$d"/*.app.tar.gz; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .app.tar.gz)
            case "$base" in *_"$arch") continue ;; esac # already stamped
            mv "$f" "$d/${base}_${arch}.app.tar.gz"
            [ -e "${f}.sig" ] && mv "${f}.sig" "$d/${base}_${arch}.app.tar.gz.sig"
          done
          ls -1 "$d"

      - name: Attach installers + signed updater artifacts to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Installers (nsis/dmg/appimage/deb) for fresh installs, PLUS the updater bundles + `.sig`
          # the in-place auto-updater downloads. On macOS the updater artifact is `*.app.tar.gz` (in the
          # macos/ subfolder), NOT the dmg. The `.sig` contents are embedded into latest.json below.
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb

      # Emit a one-platform fragment { "<target>": { signature, url } } for latest.json. The `url` is
      # pinned to THIS release's tag (not /latest/) so the signature always matches the binary it names;
      # only the manifest filename itself is fetched via the stable /latest/download/latest.json endpoint.
      # Runs on BOTH triggers so a dispatch can dry-run the whole manifest path (see the job below).
      - name: Assemble updater manifest fragment
        shell: bash
        env:
          TARGET: ${{ matrix.updater_target }}
          # A real release pins the urls to ITS tag. A manual dry run has no tag, so it uses a
          # placeholder: the manifest still assembles and gets uploaded for inspection, but is never
          # published — the point is to exercise this path WITHOUT cutting a release.
          TAG: ${{ github.event.release.tag_name || 'v0.0.0-dryrun' }}
        run: |
          set -euo pipefail
          # The UPDATER artifact per platform is nsis (.exe), macOS .app.tar.gz, or Linux .AppImage —
          # NOT the .deb (Tauri also signs the deb, but the Linux updater installs the AppImage, so a
          # deb url in latest.json would make Linux auto-update download an un-appliable package).
          # Exclude deb/ so `head -n1` can't pick the wrong signature.
          sig_file=$(find apps/desktop/src-tauri/target/release/bundle -name '*.sig' -not -path '*/deb/*' | head -n1)
          if [ -z "$sig_file" ]; then
            echo "ERROR: no updater .sig produced for $TARGET (createUpdaterArtifacts off, or signing env missing)" >&2
            exit 1
          fi
          name=$(basename "${sig_file%.sig}")
          url="https://github.com/brcampidelli/chimera-agent/releases/download/${TAG}/${name}"
          mkdir -p manifest-fragments
          # jq builds the JSON so newlines/quoting in the signature are handled correctly.
          jq -n --arg t "$TARGET" --arg s "$(cat "$sig_file")" --arg u "$url" \
            '{($t): {signature: $s, url: $u}}' > "manifest-fragments/${TARGET}.json"
          cat "manifest-fragments/${TARGET}.json"

      - name: Upload manifest fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manifest-fragment-${{ matrix.updater_target }}
          path: manifest-fragments/${{ matrix.updater_target }}.json
          if-no-files-found: error
          retention-days: 5

      # What a USER downloads, and nothing else. `bundle/**/*` also swept in `Chimera.AppDir` — the
      # unpacked tree the AppImage is built FROM — so the artifact was the installer plus its own raw
      # material, and reading its size as a download size overstated it several times over. That
      # mistake cost a round of investigation into megabytes nobody would ever fetch.
      - name: Report installer sizes
        if: github.event_name != 'release'
        shell: bash
        run: |
          # Only the files a user fetches. `du --max-depth` is GNU-only and fails on macOS, which
          # is how the first version of this step broke two jobs while reporting nothing — a
          # measurement that takes down the thing it measures is worse than no measurement.
          cd apps/desktop/src-tauri/target/release/bundle
          find . -type f -size +1M -not -path '*.AppDir*' -not -path '*.app/*' -exec ls -lh {} +

      - name: Upload installers as workflow artifacts (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chimera-installers-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/*/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/*/*.deb
            apps/desktop/src-tauri/target/release/bundle/*/*.exe
            apps/desktop/src-tauri/target/release/bundle/*/*.dmg
            apps/desktop/src-tauri/target/release/bundle/*/*.tar.gz
          if-no-files-found: warn
          retention-days: 5

  # After all platforms build, merge their fragments into ONE latest.json and publish it to the
  # Release. The updater endpoint (releases/latest/download/latest.json) resolves to the newest
  # release's copy of this file, whose per-platform urls are tag-pinned to that same release.
  manifest:
    name: Assemble & publish latest.json
    needs: build
    # Job-level, and that placement is the whole fix. `secrets` is not a named value inside a step's
    # `if` — GitHub refuses to PARSE the workflow, which takes the entire file down rather than
    # skipping one step. A step's OWN `env` is not in scope for its `if` either. A job's `env` is,
    # so the secret is lifted here and the step below tests the copy.
    env:
      SITE_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    # Runs on BOTH triggers on purpose. A release publishes the manifest; a manual dispatch assembles
    # it and uploads it as an artifact instead — so the whole path (per-platform .sig -> fragment ->
    # merge -> JSON shape) is verifiable WITHOUT cutting a release. This job used to be release-only,
    # which meant the only way to test it was to publish: v0.32.0-v0.32.2 were three patch releases
    # burned debugging it in public (a macOS build that emitted no .sig, then a Linux url pointing at
    # the .deb instead of the AppImage). A dry run would have caught both before any user saw them.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach latest.json to the release
    steps:
      - name: Download all manifest fragments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: manifest-fragment-*
          path: fragments
          merge-multiple: true

      - name: Build latest.json
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || 'v0.0.0-dryrun' }}
          NOTES: ${{ github.event.release.name || 'dry run — not published' }}
        run: |
          set -euo pipefail
          version="${TAG#v}" # updater compares MAJOR.MINOR.PATCH ints, so strip any leading 'v'
          if ! ls fragments/*.json >/dev/null 2>&1; then
            echo "ERROR: no manifest fragments found — no updater artifacts were produced" >&2
            exit 1
          fi
          platforms=$(jq -s 'add' fragments/*.json) # merge each {target:{...}} into one platforms map
          jq -n \
            --arg version "$version" \
            --arg notes "${NOTES:-Chimera $TAG}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json
          echo "--- latest.json ---"
          cat latest.json

      - name: Publish latest.json to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: latest.json

      # A dry run stops here: the manifest is uploaded for inspection, never published. Download it
      # (or read the `--- latest.json ---` dump above) and check each platform points at the right
      # updater artifact — .exe (nsis), .app.tar.gz (macOS, one per arch), .AppImage (Linux, NOT the
      # .deb) — before cutting a release.
      - name: Upload latest.json for inspection (dry run — not published)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: latest-json-dryrun
          path: latest.json
          if-no-files-found: error
          retention-days: 5

      # Tell the website. Last step of the last job, and the position is the whole point: the site
      # resolves download links at BUILD time and drops a release whose installers are not all
      # uploaded yet, so a notice sent when the release is published would arrive while half the
      # assets are still going up — the site would build, find an incomplete release, skip it, and
      # show the previous version until the next nightly. Sent from here, every artefact including
      # latest.json is already attached.
      #
      # The site has listened for this event since it was written (`repository_dispatch:
      # chimera-release` in its deploy workflow, with a comment saying the site "follows a release
      # rather than waiting for someone to notice"). Nothing ever sent it. The nightly cron was doing
      # the whole job, which is why a fresh release could sit for hours behind a download page
      # advertising the previous one.
      #
      # Skipped, never failed, when the token is absent: the token belongs to another repository, and
      # a release that goes red because a website was not notified would be a far worse outcome than
      # a website that updates on the nightly instead. `continue-on-error` covers the other half —
      # the site being down does not make this release wrong.
      # THE RELEASE BECOMES "LATEST" HERE, and the position is the whole point.
      #
      # The updater endpoint is `releases/latest/download/latest.json`, which resolves to whatever
      # GitHub calls the latest release. Published the ordinary way, a release becomes latest the
      # INSTANT it is created — twenty-five minutes before this job attaches the manifest — and for
      # that whole window the endpoint 404s and every installed app's update check fails. Silently,
      # by design: the startup check swallows errors so it never nags. Measured on v0.49.0.
      #
      # So `RELEASING.md` says to create it with `--latest=false`, and this promotes it once the
      # manifest is up. Until then the endpoint keeps resolving to the PREVIOUS release, which has
      # a valid manifest naming a real version — old clients are offered that, which is correct,
      # instead of meeting a 404.
      #
      # The failure mode improves too, and that is not a side effect. A build that dies halfway now
      # leaves the previous release as latest: a broken release is simply not offered, rather than
      # becoming the one everybody's updater points at and cannot read.
      #
      # `--latest=false` still fires `release: published`, so this workflow triggers exactly as
      # before. A DRAFT would not have: drafts fire no release event at all, which is why the
      # obvious "create it as a draft" version of this fix does not work.
      - name: Mark the release as latest, now that the manifest is attached
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest

      - name: Tell the website a release is out
        # Reads the JOB's env, set above. Not `secrets.…` (unparseable in a step `if`, and it takes
        # the whole workflow file down with it), and not the step's own `env` (not in scope for the
        # `if`, which is evaluated first — the condition would be empty on every run).
        if: github.event_name == 'release' && env.SITE_TOKEN != ''
        continue-on-error: true
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/brcampidelli/chimera-site/dispatches \
            -d "{\"event_type\":\"chimera-release\",\"client_payload\":{\"tag\":\"$TAG\"}}"
          echo "notified chimera-site about $TAG"
