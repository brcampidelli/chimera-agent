# Dependency updates.
#
# Chimera's headline claim is "security by architecture", and the taint layer plus the sandbox are
# defences against what a *model* does. Neither of them looks at what our own dependency tree drags
# in. A known-vulnerable transitive package is a hole under the whole argument, so the tree gets
# watched on a schedule like everything else we claim.
#
# Grouped by ecosystem and batched weekly: an unbatched dependabot on three ecosystems opens enough
# PRs to train maintainers to rubber-stamp them, which is worse than not running it.
#
# Majors are NOT grouped, and that is the point of `update-types` below. Grouping them with patches
# produced one weekly PR that could not be merged and could not be split: twelve dev packages at
# once, carrying Tailwind 3->4, TypeScript 5->7, Vite 6->8 and Vitest 3->4. Each of those is a
# migration; together they are a rewrite nobody reviews. The batched PR is now patches and minors —
# safe to read and merge in one sitting — and every major arrives on its own, where it can be
# migrated and tested by itself.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # `mcp` is pinned `<2` on purpose and the reason is written above the pin: 2.x removed the API
    # `ChimeraMCP.build` uses, so `@server.list_tools()` raises AttributeError and `chimera mcp-serve`
    # dies on start. `tests/test_mcp_dependency_is_real.py::test_the_sdk_pin_has_a_ceiling` catches
    # any widening, which means the bot proposes it weekly and the build refuses it weekly — a PR
    # that can only ever be closed, arriving forever.
    #
    # Ignoring the MAJOR only. A 1.x release still gets proposed, which is the part that can be
    # taken. Lift this together with the pin, when `ChimeraMCP.build` is ported to the 2.x handler
    # API — not before, and not instead.
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      python-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      python-runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The desktop app ships in the [desktop] extra, so its npm tree is part of what users install.
  - package-ecosystem: "npm"
    directory: "/apps/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      npm-runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]
